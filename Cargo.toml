[workspace]
resolver = "2"
members = [
    "crates/vectify-core",
    "crates/vectify-cli",
    "crates/vectify-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
# 100% vibe coded, one-off tool: not a maintained product.

[workspace.dependencies]
anyhow = "1"
image = "0.25"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
resvg = "0.48"
usvg = "0.48"
tiny-skia = "0.12"
vectify-core = { path = "crates/vectify-core" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 1
